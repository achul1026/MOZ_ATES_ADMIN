<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">

    <div id="container-fluid">
        <div id="detail-content-title">Main Menu Info</div>

        <form id="menuSaveform">
            <input type="hidden" name="subSortNo" value="0">
            <table class="sub-table detail-table">
                <colgroup>
                    <col width="15%">
                    <col width="35%">
                    <col width="15%">
                    <col width="35%">
                </colgroup>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{sitemng.common.menu.nameEng}">메뉴 이름 ENG</span>
                    </th>
                    <td>
                        <input type="text" id="menuNmEng" class="main-input data-validate" name="menuNmEng"
                               placeholder="Traffic Accident"
                               data-valid-required th:data-valid-name="#{sitemng.common.menu.nameEng}"
                               maxlength="50">
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{sitemng.common.menu.namePor}"></span>
                    </th>
                    <td>
                        <input type="text" id="menuNmPor" class="main-input data-validate" name="menuNmPor"
                               placeholder="ACIDENTE DE TRÂNSITO"
                               data-valid-required th:data-valid-name="#{sitemng.common.menu.namePor}"
                               maxlength="50">
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{sitemng.common.menu.mainMenuOrder}">메인 메뉴 순서</span>
                    </th>
                    <td>
                        <input type="number" id="mainSortNo" class="main-input data-validate" name="mainSortNo"
                               placeholder="15"
                               data-valid-required th:data-valid-name="#{sitemng.common.menu.mainMenuOrder}"
                               data-valid-maximum="3" onkeyup="keyupNumberEvent(this)">
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{sitemng.common.menu.urlPttrn}">URL 패턴</span>
                    </th>
                    <td>
                        <input type="text" id="menuUrlPattrn" class="main-input data-validate" name="menuUrlPattrn"
                               placeholder="/acdnt/**"
                               data-valid-required th:data-valid-name="#{sitemng.common.menu.urlPttrn}"
                               maxlength="50">
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{sitemng.common.menu.url}">URL</span>
                    </th>
                    <td>
                        <input type="text" id="menuUrl" class="main-input data-validate" name="menuUrl"
                               placeholder="/acdnt/mng/list.do"
                               data-valid-required th:data-valid-name="#{sitemng.common.menu.url}"
                               maxlength="50">
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{common.common.status}">노출여부</span>
                    </th>
                    <td>
                        <select id="useYn" name="useYn" class="filter-select">
                            <option value="Y" th:text="#{sitemng.common.menu.exposed}">노출</option>
                            <option value="N" th:text="#{sitemng.common.menu.nonExposed}">비노출</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark"
                              th:text="#{sitemng.common.menu.abbreviation}">Menu Abbreviation</span>
                    </th>
                    <td>
                        <input type="text" class="main-input data-validate" id="menuAbv" name="menuAbv" placeholder="acdnt"
                               data-valid-required th:data-valid-name="#{sitemng.common.menu.abbreviation}"
                               maxlength="50">
                    </td>
                </tr>
            </table>
        </form>

        <div class="btn-wrap-center">
            <button type="button" class="sub-btn form-button" onclick="location.href='/siteMng/menu/list.do'">List
            </button>
            <button type="button" class="main-btn form-button" onclick="fnSaveMainMenu()">Save</button>
        </div>


    </div>


</th:block>

</html>
<script th:inline="javascript">
    function fnSaveMainMenu() {
        if (!$("#menuSaveform").soValid()) return;

        let confirmMsg = /*[[#{sitemng.common.menu.message.confirmRegist}]]*/;
        let successMsg = /*[[#{common.message.success}]]*/;
        let failMsg = /*[[#{common.message.fail}]]*/;

        new ModalBuilder().init().successBody(confirmMsg).footer(2, 'Confirmar', function (button, modal) {
            modal.close();
            setTimeout(() => {
                $.ajax({
                    type: "post",
                    data: $("#menuSaveform").serialize(),
                    url: "/siteMng/menu/save.ajax",
                    success: function (data) {
                        let code = data.code;
                        if (code === 200) {
                            new ModalBuilder().init().successBody(successMsg).footer(4, 'Confirmar', function (button, modal) {
                                location.href = "/siteMng/menu/list.do";
                                modal.close();
                            }).open();
                        } else {
                            new ModalBuilder().init().alertBody(failMsg).footer(4, 'Confirmar', function (button, modal) {
                                modal.close();
                            }).open();
                        }
                    }
                });
            }, 500);
        }).open();
    }

</script>
