<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<th:block layout:fragment="content">
	<div id="container-fluid">
		<h1 id="detail-content-title" th:text="#{enforcement.driver.search.Detail.title}">운전자 정보</h1>

		<table class="detail-table">
			<colgroup>
				<col width="15%">
				<col width="35%">
				<col width="15%">
				<col width="35%">
			</colgroup>
			<tbody id="driverInfoTable">
				<tr>
					<th th:text="#{enforcement.driver.search.Detail.driverLicense}">Name</th>
					<td th:text="${driverInfo.codigo}">DriverLicenseId</td>
					<th th:text="#{enforcement.driver.search.Detail.driverType}">ID</th>
					<td>
						<th:block th:each="classes , classesIdx : ${driverInfo.classes}">
							<input th:if="${classesIdx.index}" type="hidden" name="classes" th:value="${classes.key}"/>
							<h6 class="mb8" th:text="${classes.key + ' - ' + classes.value}"></h6>
						</th:block>
					</td>
				</tr>
				<tr>
					<th th:text="#{enforcement.driver.search.Detail.birth}">birth</th>
					<td th:text="${driverInfo.dataDeNascimento}">driverBrth</td>
					<th th:text="#{enforcement.driver.search.Detail.name}">driverNm</th>
					<td th:text="${driverInfo.nome}"></td>
				</tr>
				<tr>
					<th th:text="#{enforcement.driver.search.Detail.address}">address</th>
					<td th:text="${vioAddr}"></td>
					<th th:text="#{enforcement.driver.search.Detail.phoneNum}">phoneNum</th>
					<td th:text="${driverInfo.phone1}"></td>
				</tr>
				<tr>
					<th th:text="#{enforcement.driver.search.Detail.docNo}">Document Number</th>
					<td th:text="${driverInfo.docNumber}"></td>
					<th th:text="#{enforcement.driver.search.Detail.docType}">Document Type</th>
					<td th:text="${driverInfo.tipoDocumento}"></td>
				</tr>
				<tr>
					<th th:text="#{enforcement.driver.search.Detail.sex}">Sex</th>
					<td th:text="${driverInfo.genero}"></td>
					<th th:text="#{enforcement.driver.search.Detail.expiration}">License Expiration Date</th>
					<td th:text="${driverInfo.fimValidadeClasse}"></td>
				</tr>
				<tr>
					<th th:text="#{enforcement.driver.search.Detail.driverRestrictions}">운전자 제한</th>
					<td th:text="${driverInfo.restricaoCondutor}"></td>
					<th th:text="#{enforcement.driver.search.Detail.vehicleRestrictions}">차량 제한</th>
					<td th:text="${driverInfo.restricaoVeiculo}"></td>
				</tr>
				</tbody>
		</table>

		<h1 id="detail-content-title" th:text="#{enforcement.car.search.Detail.title.history}">교통단속내역</h1>
		<div id="ajaxContent"></div>
		<form id="frmSearch">
			<input type="hidden" id="page" name="page" value="1">
			<input type="hidden" name="dvrLcenId" th:value="${driverInfo.codigo}">
		</form>

		<div class="btn-wrap-center">
			<button type="button" class="sub-btn" onclick="javascript:window.history.back()"
				th:text="#{common.button.back}"> 이전 페이지</button>
		</div>
	</div>

	<script th:inline="javascript">
		const ajaxContent = document.getElementById('ajaxContent');

		document.addEventListener('DOMContentLoaded', getDetailList);

		function fnPageMove(page) {
			document.getElementById('page').value = page;
			getDetailList();
		}

		function getDetailList() {
			const loading = new AdminLoading().start(/*[[#{enforcement.car.search.Detail.loading}]]*/);

			const frmSearch = document.getElementById("frmSearch");
			const formData = new FormData(frmSearch);

			fetch(/*[[@{/enf/driver/list.ajax}]]*/, {
				method: 'post'
				, body: formData
			})
					.then(response => response.text())
					.then((html) => {
						ajaxContent.innerHTML = html;
					})
					.finally(() => {
						loading.end();
					});
		}
	</script>
</th:block>
