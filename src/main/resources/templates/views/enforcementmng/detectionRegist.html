<script th:inline="javascript">
    $(document).ready(function () {
        // 날짜 Max 설정
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('tfcEnfDt').max = `${year}-${month}-${day}T${hours}:${minutes}`;
    });

    function saveInfo() {
        if (!$("#frmEnfRegist").soValid()) return;

        var form = $("#frmEnfRegist")[0];
        var data = new FormData(form);

        data.append("vioInfo.docType", $(".docType").val());
        data.append("vioInfo.docNid", $(".docNid").val());
        data.append("vioInfo.dvrLcenId", $(".dvrLcenId").val());
        data.append("vioInfo.dvrLcenTy", $(".dvrLcenTy").val());
        data.append("vioInfo.vioNm", $(".vioNm").val());
        data.append("vioInfo.vioBrth", $(".vioBrth").val());
        data.append("vioInfo.vioAddr", $(".vioAddr").val());
        data.append("vioInfo.vioPno", $(".vioPno").val());
        data.append("vioInfo.vioEmail", $(".vioEmail").val());
        data.append("finePymntInfo.placePymntId", $(".placePymntId").val());

        var lwChkInfo = $(".lwChkInfo");
        $(lwChkInfo).each(function (index, value) {
            data.append("tfcFineNtcInfoList[" + index + "].tfcLawFineId", $(this).data("fine-value"));
            data.append("tfcFineNtcInfoList[" + index + "].tfcLawId", $(this).data("value"));
            data.append("tfcFineNtcInfoList[" + index + "].tfcEnfPrice", $(this).data("price"));
        });

        $.ajax({
            url: /*[[@{/enf/detection/save.ajax}]]*/ "/enf/detection/save.ajax",
            type: "post",
            data: data,
            processData: false,
            contentType: false,
            success: function (result) {
                if (result.code === 200) {
                    new ModalBuilder().init().successBody(result.message).footer(4, 'Confirmar', function (button, modal) {
                        modal.close();
                        const data = result.data;
                        const url = /*[[@{/enf/info/detail.do?tfcEnfId=}]]*/
                        location.href = url + data;
                    }).open();
                } else {
                    new ModalBuilder().init().alertBody(result.message).footer(4, 'Confirmar', function (button, modal) {
                        modal.close();
                    }).open();
                }
            }
        });
    }

    function viewLwFineInfo(_this) {
        let tfcLawId = _this.value;

        $("#lawDetailChk td").empty();
        if (!isNull(tfcLawId)) {
            $.ajax({
                url: /*[[@{/enf/info/lwFineInfo.ajax}]]*/ "/enf/info/lwFineInfo.ajax",
                type: "post",
                dataType: "json",
                data: {
                    "tfcLawId": tfcLawId
                },
                success: function (result) {
                    const lawFineInfoList = result.data;
                    if (lawFineInfoList.length === 0) return false;

                    const aticleId = _this.options[_this.selectedIndex].innerText;
                    for (var i = 0; i < lawFineInfoList.length; i++) {
                        const finePrice = lawFineInfoList[i].finePrice;
                        if (finePrice === null) continue;
                        const finePriceStr = numberComma(lawFineInfoList[i].finePrice);
                        const tfcLawFineId = lawFineInfoList[i].tfcLawFineId;
                        const tfcLawId = lawFineInfoList[i].tfcLawId;
                        const fineDesc = lawFineInfoList[i].fineDesc;
                        const lawType = lawFineInfoList[i].lawType

                        let lawFullNo = '';
                        let artclNo = '';
                        let par = '';
                        artclNo = lawFineInfoList[i].artclNo;
                        par = lawFineInfoList[i].par;

                        if (artclNo === '' && par === '') {
                            lawFullNo = `${aticleId}`;
                        } else {
                            if (artclNo === '') {
                                lawFullNo = `${aticleId}--${par}`;
                            } else if (par === '') {
                                lawFullNo = `${aticleId}-${artclNo}`;
                            } else {
                                lawFullNo = `${aticleId}-${artclNo}-${par}`;
                            }
                        }

                        let html = `
						<div class="lawInfoList">
							<input type="radio" class="lwInfo" id="lwInfo${i}" name="lwInfo" data-fine-value="${tfcLawFineId}" data-value="${tfcLawId}" data-desc="[${lawType}](${lawFullNo})(${finePrice}MT) ${fineDesc}" data-price="${finePrice}">
							<label for="lwInfo" class="lawInfoText">[${lawType}]${lawFullNo} ${fineDesc} <span id="finePrice" class="lawInfoPrice">${finePrice}MT</span></label>
							
						</div>
						`;

                        $("#lawDetailChk td").append(html);
                    }
                    $("#lawDetailChk td").append('<button type="button" class="main-btn lwInfoPlusBtn" onclick="saveLwFindInfo()">Add</button>');

                }
            })

            $("#lawDetailChk").show();
        } else {
            $("#lawDetailChk").hide();
        }
    }

    function saveLwFindInfo() {
        $(".lwInfo").each(function () {
            if ($(this).is(":checked")) {
                html = '';
                html += '<div class="lwChkInfoDiv">';
                html += '<p class="lwChkInfo" data-fine-value="' + $(this).data("fine-value") + '" data-value="' + $(this).data("value") + '" data-price="' + $(this).data("price") + '">' + $(this).data("desc") + '</p>';
                html += '<button type="button" class="delete-btn" onclick="deleteLwInfo(this)">Delete</button>';
                html += '</div>';
                $("#lawDetail td").append(html);

                fnSetTotalPrice();
            }
        });
    };

    function fnSetTotalPrice() {
        const tfcEnfPriceList = $(".lwChkInfo");

        if (tfcEnfPriceList.length == 0) {
            $("#totalPrice").val(0);
            return false;
        }

        var totalPrice = 0;
        $(".lwChkInfo").each(function () {
            totalPrice += Number($(this).data("price"));
        })

        $("#totalPrice").val(totalPrice);
    }

    function deleteLwInfo(_this) {
        $(_this).parent(".lwChkInfoDiv").remove();
        fnSetTotalPrice();
    }

    // 모달 수정 여부 확인필요
    const modalContent = document.getElementById("modal");

    // police modal
    function changePolListModal(type) {
        if (type == "show") {
            $.ajax({
                url: '/common/modal/pol/list.ajax',
                type: "get",
                dataType: 'html',
                success: function (data) {
                    modalContent.innerHTML += data;
                    modalContent.style.display = 'block';
                }
            });
        } else if (type == "hide") {
            modalContent.innerHTML = '';
            modalContent.style.display = 'none';
        }
    }

    //API Modal
    function searchForApiData() {

        const resultMsg = /*[[#{common.search.notFound}]]*/;

        let searchContent = '';

        $.ajax({
            url: `/common/modal/apiSearch.ajax`,
            data: {
                "searchContent": searchContent
            },
            type: "get",
            dataType: 'html',
            success: function (data) {
                modalContent.innerHTML += data;
                modalContent.style.display = 'block';

                const searchContentElement = document.getElementById('searchContent');
                searchContentElement.addEventListener('keyup', numberOnly);

                document.getElementById('searchType').addEventListener('change', function () {
                    const searchType = this.value;
                    let searchContent = document.getElementById('searchContent');

                    if (searchType === 'dvrLcenId') {
                        searchContent.value = '';
                        searchContent.addEventListener('keyup', numberOnly);
                    } else {
                        searchContent.removeEventListener('keyup', numberOnly);
                    }
                });

                document.getElementById('searchBtn').addEventListener('click', function () {
                    const resultTable = document.getElementById('table_api_search');

                    const searchType = document.getElementById('searchType').value;
                    const searchValue = document.getElementById('searchContent').value;

                    if (searchType == null || searchType == '' || searchValue == null || searchValue == '') {
                        ////검색결과 0 으로 나오게 하기 경용
                        textAlert.style.display = "block";
                        return;
                    }

                    const fetcher = new DriverSelectAPI();

                    const loading = new AdminLoading().start("Busca...");

                    fetcher.fetchData(searchType, searchValue, function (data) {
                        const tbody = document.getElementById('modalTbody');
                        tbody.empty();

                        switch (searchType) {
                            case 'dvrLcenId':
                                if (data != null) {
                                    const tr = document.createElement('tr');
                                    data.searchType = 'dvrLcenId';
                                    tr.dataset.prop = JSON.stringify(data);
                                    tr.setAttribute('onclick', 'apiForApiData(this)');

                                    let birthday = new Date(data.data_de_nascimento);
                                    let birthdayFormat = `${birthday.getDate()}.${birthday.getMonth() + 1}.${birthday.getFullYear()}`;

                                    tr.innerHTML =
                                        `<td>${data.nome}</td>
					               	<td>${birthdayFormat}</td>
					               	<td>${data.tipo_documento}</td>
					               	<td>${data.doc_number}</td>
					               	<td>${data.phone1}</td>`;

                                    tbody.appendChild(tr);

                                    resultTable.style.display = 'table';
                                } else {
                                    const label = document.createElement('label');

                                    tr.innerHTML = `
									<div>${resultMsg}</div>
								`;
                                    tbody.appendChild(tr);

                                    resultTable.style.display = 'table';
                                }
                                break;
                            case 'vehicleNo':
                                let parsedData = JSON.parse(data);
                                if (parsedData != null && parsedData.tab1.length > 0) {
                                    parsedData.tab1.forEach(item => {
                                        const tr = document.createElement('tr');
                                        item.searchType = 'vehicleNo';
                                        tr.dataset.prop = JSON.stringify(item);
                                        tr.setAttribute('onclick', 'apiForApiData(this)');

                                        let birthday = new Date(item.datadenascimento);
                                        let birthdayFormat = `${birthday.getDate()}.${birthday.getMonth() + 1}.${birthday.getFullYear()}`;

                                        tr.innerHTML =
                                            `<td>${item.nome}</td>
						               	<td>${birthdayFormat}</td>
						               	<td>${item.tipodedocumento}</td>
						               	<td>${item.numerododocumento}</td>
						               	<td>${item.contacto}</td>`;

                                        tbody.appendChild(tr);

                                        resultTable.style.display = 'table';
                                    });
                                } else {
                                    const tr = document.createElement('tr');

                                    tr.innerHTML = `
						               	<td colspan="5">${resultMsg}</td>
					               	`;
                                    tbody.appendChild(tr);

                                    resultTable.style.display = 'table';
                                }
                                break;
                        }
                        loading.end();
                    });
                });
            }
        });
    }

    function findPolBtn() {
        $("#modalTbody > tr").remove();
        $("#modalPaging > div").remove();

        var page = $("#modalPage").val();
        var searchTxt = $("#searchContent").val();
        var start = $("#modalStart").val();
        $.ajax({
            type: "get",
            data: {"searchType": "oprtrNm", "searchTxt": searchTxt, "page": page, "start": start},
            url: '/common/modal/pol/search/list.ajax',
            success: function (result) {
                var html = '';
                $(result.data.list).each(function (index, item) {
                    var jur = item.jur;
                    var polNm = item.polNm;
                    if (isNull(jur)) {
                        jur = '-';
                    }
                    if (isNull(polNm)) {
                        polNm = '-';
                    }
                    html += '<tr onclick="selectPol(\'' + item.polId + '\', \'' + polNm + '\', \'' + jur + '\')">' +
                        '<td>' + item.rnum + '</td>' +
                        '<td>' + polNm + '</td>' +
                        '<td>' + jur + '</td>' +
                        '</tr>';
                })
                $("#modalTbody").append(html);
                var paging = result.data.pagination;
                if (paging != null && paging != '' && paging.totalListCnt > 0) {
                    $("#modalPaging").append(getPagingHtml(paging, page));
                }
                $("#totalCnt").text(paging.totalListCnt);
                var start = result.data.polInfo.start;
                $("#modalStart").val();
            }
        });
    }

    function selectDvrLcenTy(text) {
        const selectElement = document.getElementById('dvrLcenTy');
        const options = selectElement.querySelectorAll('option');

        options.forEach(option => {
            if (option.text === text) {
                option.selected = true;
            }
        });
    }

    function apiForApiData(_this) {
        const resultTable = document.getElementById('table_api_search');

        let objJsonStr = _this.dataset != null ? _this.dataset.prop : null;

        const obj = JSON.parse(objJsonStr);

        let birthday = null;
        let birthdayFormat = null;

        if (obj != null) {
            switch (obj.searchType) {
                case 'dvrLcenId':
                    birthday = new Date(obj.data_de_nascimento);
                    birthdayFormat = `${birthday.getDate()}.${birthday.getMonth() + 1}.${birthday.getFullYear()}`;

                    let fullAddr = createAddress(obj.enderesso1, obj.enderesso2, obj.enderesso3, obj.enderesso4);
                    let classes = getFirstKey(obj.classes);
                    document.getElementById('dvrLcenId').value = obj.codigo;
                    selectDvrLcenTy(classes);
                    document.getElementById('docNid').value = obj.doc_number;
                    document.getElementById('docType').value = obj.tipo_documento;
                    document.getElementById('vioNm').value = obj.nome;
                    document.getElementById('vioBrth').value = birthdayFormat;
                    document.getElementById('vioPno').value = obj.phone1;
                    document.getElementById('vioAddr').value = fullAddr;
                    break;
                case 'vehicleNo':
                    birthday = new Date(obj.datadenascimento);
                    birthdayFormat = `${birthday.getDate()}.${birthday.getMonth() + 1}.${birthday.getFullYear()}`;

                    document.getElementById('dvrLcenId').value = obj.numerododocumento;
                    document.getElementById('dvrLcenTy').value = obj.tipodedocumento;
                    document.getElementById('vioNm').value = obj.nome;
                    document.getElementById('vioBrth').value = birthdayFormat;
                    document.getElementById('vioPno').value = obj.contacto;
                    document.getElementById('vioAddr').value = obj.domicilio;
                    break;
            }
        }
        resultTable.style.display = 'none';

        modalContent.innerHTML = '';
        modalContent.style.display = 'none';
    }

    function fnPageMove(page) {
        $("#modalPage").val(page);
        findPolBtn();
    }

    function selectPol(polId, polNm, polDeptNm) {
        $("#polId").val(polId);
        $("#polNm").val(polNm);
        $("#polDeptNm").text(polDeptNm);
        changePolListModal('hide');
    }

    const lat = /*[[${detectionDetail.tfcEnfEqpMatser?.lat}]]*/;

    $("#tfcEnfDt").on('change', function () {
        // 미래의 시간이 선택된 경우
        if (this.validity.rangeOverflow) {
            this.value = '';
            $(".tfcEnfDt").val('');
            new ModalBuilder().init().alertBody([[#{enforcement.detectionRegist.msg.date.invalid}]]).footer(4, "Confirmar", function (button, modal) {
                    modal.close();
                }
            ).open();

        var date = new Date(value);
        var formattedDateTime = formatDate(date);
        $(".tfcEnfDt").val(formattedDateTime);

    const distListData = /*[[${distList}]]*/;

    function getDistOptions(_this) {
        const distIdWrap = document.getElementById('distId');
        const defaultOptionMsg = /*[[#{enforcement.detectionRegist.div.district}]]*/;

        distIdWrap.innerHTML = '';

        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = defaultOptionMsg;

        distIdWrap.appendChild(defaultOption);

        const prvId = _this.value;
        if (prvId === '') return false;

        for (const itm of distListData) {
            if (itm.prvId == prvId) {
                for (const dist of itm.distList) {
                    const distOption = document.createElement('option');
                    distOption.value = dist.distId;
                    distOption.textContent = dist.distDesc;
                    distIdWrap.appendChild(distOption);
                }
                break;
            }
        }
    }
</script>
