<html xmlns:th="http://www.thymeleaf.org">
	
<div class="modal-contents modal-company-group">
	
	<div class="modal-title">
		<div class="modal-title-text" th:text="#{common.oprtr.title}">담당경찰관 검색</div>
		<img src="/images/close.png" alt="닫기" class="close" onclick="changePolListModal('hide')">
	</div>
	
	<div class="modal-body">
		<div class="modal-form-wrap">
			<input type="hidden" id="modalPage" name="page" value="1">
			<input type="hidden" id="modalStart" name="start" th:value="${polInfo.start}">			
			<input type="text" class="modal-search" id="searchContent" th:placeholder="#{common.placeholder.enterName}">
			<i class="modal-search-icon"onclick="findPolBtn()"></i>
		</div>
		
		<div class="ex-group-name" th:text="#{common.oprtr.exmpTxt}">경찰관 이름2글자 이상 입력</div>

		<div class="modal-search-list">
			<div class="modal-search-result">
				<span th:text="#{common.search.prefix}">Found</span>
				<span class="searchResult" th:text='|"${pagination.totalListCnt}"|' id="totalCnt"></span>
				<span th:text="#{common.search.suffix}">results</span>
			</div>
			<table class="main-table">
				<thead>
					<th th:text="#{common.oprtr.tableNo}">번호</th>
					<th th:text="#{common.oprtr.tableNm}">담당자</th>
					<th th:text="#{common.oprtr.tableJur}">관할지역</th>
				</thead>
				<tbody id="modalTbody">
					<tr th:each="polItem : ${polList}" th:onclick="selectPol([[${polItem.polId}]],  [[${polItem.polNm}]], [[${polItem.jur}]])">
						<td th:text="${polItem.rnum}"></td>
						<td th:text="${polItem.polNm != null ? polItem.polNm : '-'}"></td>
						<td th:text="${polItem.jur != null ? polItem.jur : '-'}"></td>
					<tr>
				</tbody>
			</table>
			<div class="page_wrap" id="modalPaging">
				<div th:insert="tags/paging :: pagingFragment"></div>
			</div>
		</div>
	</div>
</div>
<script th:inline="javascript">
</script>
</html>
