<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div id="container-fluid">
        <!-- Page Heading -->
        <h1 id="detail-content-title" th:text="#{equipment.mngRegist.title}">단속장비 등록</h1>

        <form id="frmEqpRegist" enctype="multipart/form-data">
            <table class="detail-table">
                <colgroup>
                    <col width="15%">
                    <col width="35%">
                    <col width="15%">
                    <col width="35%">
                </colgroup>
                <tbody>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.equipmentId}">장비 ID</span>
                    </th>
                    <td colspan="3">
                        <input type="text" name="tfcEnfEqpId" class="main-input data-validate" maxlength="50"
                               th:placeholder="#{equipment.mngRegist.placeholder.equipmentId}"
                        data-valid-required th:data-valid-name="#{equipment.mngRegist.equipmentId}">
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark"
                              th:text="#{equipment.mngRegist.typesOfEnforcementEquipment}">단속장비 종류</span>
                    </th>
                    <td>
                        <select id="eqpTy" class="filter-select filter95 data-validate" name="eqpTy"
                                th:data-valid-name="#{equipment.mngRegist.typesOfEnforcementEquipment}"
                                data-valid-required>
                            <option value="">Select</option>
                            <th:block th:each="cdItem : ${cdList}">
                                <option th:value="${cdItem.cdId}" th:text="${cdItem.cdNm}"></option>
                            </th:block>
                        </select>
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.equipmentName}">이름</span>
                    </th>
                    <td>
                        <input type="text" class="main-input data-validate" id="eqpNm" name="eqpNm"
                               th:placeholder="#{equipment.mngRegist.placeholder.equipmentName}"
                               th:data-valid-name="#{equipment.mngRegist.equipmentName}"
                               data-valid-required maxlength="100">
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.modelName}">모델명</span>
                    </th>
                    <td>
                        <input type="text" class="main-input data-validate" id="modelNm" name="modelNm"
                               th:placeholder="#{equipment.mngRegist.placeholder.modelName}"
                               th:data-valid-name="#{equipment.mngRegist.modelName}"
                               data-valid-required maxlength="100">
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.manufacturer}">제조업체</span>
                    </th>
                    <td>
                        <input type="text" class="main-input data-validate" id="mnfctr" name="mnfctr"
                               th:placeholder="#{equipment.mngRegist.placeholder.manufacturer}"
                               th:data-valid-name="#{equipment.mngRegist.manufacturer}"
                               data-valid-required maxlength="100">
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.installationStatus}">설치 여부</span>
                    </th>
                    <td>
                        <div>
                            <label for="instlY" class="radioBox">
                                <input type="radio" id="instlY" name="instlYn" value="Y" checked>
                                <span class="radioOn"></span>
                                <span th:text="#{equipment.mngRegist.installY}">Installed</span>
                            </label>
                            <label for="instlN" class="radioBox">
                                <input type="radio" id="instlN" name="instlYn" value="N">
                                <span class="radioOn"></span>
                                <span th:text="#{equipment.mngRegist.installN}">Not installed</span>
                            </label>
                        </div>
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.usageStatus}">사용 여부</span>
                    </th>
                    <td>
                        <div>
                            <label for="useY" class="radioBox">
                                <input type="radio" id="useY" name="useYn" value="Y" checked>
                                <span class="radioOn"></span>
                                <span th:text="#{equipment.mngRegist.usageStatus.useY}">사용중</span>
                            </label>
                            <label for="useN" class="radioBox">
                                <input type="radio" id="useN" name="useYn" value="N">
                                <span class="radioOn"></span>
                                <span th:text="#{equipment.mngRegist.usageStatus.useN}">미사용</span>
                            </label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.installationLocation}">위치</span>
                    </th>
                    <td colspan="3" class="modal-find-line">
                        <input type="text" class="main-input data-validate" id="roadAddr" name="roadAddr"
                               th:placeholder="#{equipment.mngRegist.placeholder.installationLocation}"
                               th:data-valid-name="#{equipment.mngRegist.installationLocation}"
                                data-valid-required maxlength="100">
                        <br><br>
                        <div id="map" class="detailMap">

                        </div>
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.lat}">위도</span>
                    </th>
                    <td>
                        <input type="text" class="main-input lat data-validate" id="lat" name="lat"
                               th:placeholder="#{equipment.mngRegist.placeholder.lat}"
                               th:data-valid-name="#{equipment.mngRegist.lat}"
                               data-valid-required data-valid-lat>
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.lng}">경도</span>
                    </th>
                    <td>
                        <input type="text" class="main-input lng data-validate" id="lng" name="lng"
                               th:placeholder="#{equipment.mngRegist.placeholder.lng}"
                               th:data-valid-name="#{equipment.mngRegist.lng}"
                               data-valid-required data-valid-lng>
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.installationDate}">설치일자</span>
                    </th>
                    <td>
                        <input type="date" class="input-date data-validate" name="instlDate"
                               th:data-valid-name="#{equipment.mngRegist.installationDate}" data-valid-required>
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.installer}">설치자</span>
                    </th>
                    <td>
                        <input type="text" id="instler" class="main-input data-validate" name="instler"
                               th:placeholder="#{equipment.mngRegist.placeholder.installer}"
                               th:data-valid-name="#{equipment.mngRegist.installer}"
                               data-valid-required maxlength="100">
                    </td>
                </tr>
                <tr>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.manager}">담당자</span>
                    </th>
                    <td class="modal-find-line">
                        <input type="text" class="main-input data-validate" id="crOprtrNm" readonly
                               th:data-valid-name="#{equipment.mngRegist.manager}"
                               th:placeholder="#{equipment.mngRegist.placeholder.manager}" data-valid-required>
                        <input type="hidden" name="crOprtrId" id="crOprtrId">
                        <i class="search-icon" onclick="changeDeptListModal('show')"></i>
                    </td>
                    <th>
                        <span class="requiredMark" th:text="#{equipment.mngRegist.managerDept}">담당자 소속</span>
                    </th>
                    <td>
                        <input type="text" class="main-input" id="crOprtrDept" name="crOprtrDept"
                               th:placeholder="#{equipment.mngRegist.placeholder.managerDept}" readonly>
                    </td>
                </tr>
                <tr>
                    <th th:text="#{equipment.mngRegist.inserImg}">단속장비 사진 등록</th>
                    <td colspan="3">
                        <div id="dragArea" class="drag-area">
                            <div class="dragText">
                                File name cannot be more than 50 characters<br>
                                The file size can only be uploaded under 5MB<br>
                                Only JPG, JPEG, PNG, and MP4 files can be uploaded
                            </div>
                            <div>
                                <input type="file" id="uploadFiles" name="uploadFiles" multiple style="display: none;">
                                <button type="button" id="uploadBtn" class="main-btn">File Upload</button>
                            </div>
                        </div>
                        <div class="upload_wrap none">
                            <div id="newFilesContainer" class="upload_list_box"></div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th th:text="#{equipment.mngRegist.enforceementEquipmentInfo}">상세내용</th>
                    <td colspan="3">
							<textarea class="detail-table-textarea" id="tfcEnfEqpInfo" name="tfcEnfEqpInfo"
                                th:placeholder="#{equipment.mngRegist.placeholder.enforceementEquipmentInfo}"
                                maxlength="1000"></textarea>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>

        <div class="btn-wrap-center">
            <button type="button" id="btnGoList" class="sub-btn"
                    onclick="location.href='/eqp/mng/list.do?pageType=list'" th:text="#{equipment.mngRegist.list}">목록
            </button>
            <button type="button" id="btnRegist" class="main-btn" onclick="saveInfo()"
                    th:text="#{equipment.mngRegist.registrationButton}">등록
            </button>
        </div>
    </div>

    <div class="modal-wrap" id="modal"></div>

</th:block>

</html>
<script th:inline="javascript">

    $(document).ready(function () {
        fileDrag(10, 5, 100, ["jpg", "jpeg", "png", "PNG"]);
    });

    let map = new MozAtesMap({
        elementId: 'map',
        center_lng: null,
        center_lat: null,
        isInitDrawCenterMarker: false,
        isFacility: false,
        isEquipment: true
    });

    function saveInfo() {
        trimValues(['eqpNm', 'modelNm', 'mnfctr', 'roadAddr', 'lat', 'lng', 'instler', 'tfcEnfEqpInfo']);
        const form = $("#frmEqpRegist")[0];
        if ($("#frmEqpRegist").soValid()) {
            // if (map.getLat() != null && map.getLng() != null) {
            //     document.getElementById("lat").value = map.getLat();
            //     document.getElementById("lng").value = map.getLng();
            // }

            const data = new FormData(form);

            $.ajax({
                url: /*[[@{/eqp/mng/save.ajax}]]*/ "/eqp/mng/save.ajax",
                type: "post",
                enctype: 'multipart/form-data',
                data: data,
                processData: false,
                contentType: false,
                success: function (result) {
                    if (result.code === 200) {
                        new ModalBuilder().init().successBody(result.message).footer(4, 'Confirmar', function (button, modal) {
                            modal.close();
                            location.href =/*[[@{/eqp/mng/list.do?pageType=list}]]*/ "";
                        }).open();
                    } else {
                        new ModalBuilder().init().alertBody(result.message).footer(4, 'Confirmar', function (button, modal) {
                            modal.close();
                        }).open();
                    }
                }
            });
        }
    }

    const modalContent = document.getElementById("modal");

    // modal control
    function changeDeptListModal(type) {

        if (type === "show") {
            $.ajax({
                url: '/common/modal/oprtr/list.ajax',
                type: "get",
                dataType: 'html',
                success: function (data) {
                    modalContent.innerHTML += data;
                    modalContent.style.display = 'block';
                }
            });
        } else if (type === "hide") {
            modalContent.innerHTML = '';
            modalContent.style.display = 'none';
        }

    }

    function setThumbnail(event) {
        var reader = new FileReader();
        reader.onload = function (event) {
            var img = document.createElement("img");
            img.setAttribute('width', '900px');
            img.setAttribute('height', '300px');
            img.setAttribute("src", event.target.result);
            document.querySelector("div#image_container").appendChild(img);
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function findOprtrBtn() {
        $("#modalTbody > tr").remove();
        $("#modalPaging > div").remove();

        var page = $("#modalPage").val();
        var searchTxt = $("#searchContent").val();
        var start = $("#modalStart").val();
        $.ajax({
            type: "get",
            data: {"searchType": "oprtrNm", "searchTxt": searchTxt, "page": page, "start": start},
            url: '/common/modal/oprtr/search/list.ajax',
            success: function (result) {
                var html = '';
                $(result.data.list).each(function (index, item) {
                    var oprtrDeptNm = item.oprtrDeptNm;
                    var oprtrNm = item.oprtrNm;
                    if (isNull(oprtrDeptNm)) {
                        oprtrDeptNm = '-';
                    }
                    if (isNull(oprtrNm)) {
                        oprtrNm = '-';
                    }
                    html += '<tr onclick="selectDept(\'' + item.oprtrId + '\', \'' + oprtrNm + '\', \'' + oprtrDeptNm + '\')">' +
                        '<td>' + item.rnum + '</td>' +
                        '<td>' + oprtrDeptNm + '</td>' +
                        '<td>' + oprtrNm + '</td>' +
                        '</tr>';
                })
                $("#modalTbody").append(html);
                var paging = result.data.pagination;
                if (paging != null && paging != '' && paging.totalListCnt > 0) {
                    $("#modalPaging").append(getPagingHtml(paging, page));
                }
                $("#totalCnt").text(paging.totalListCnt);
            }
        });
    }

    function fnPageMove(page) {
        $("#modalPage").val(page);
        findOprtrBtn();
    }

    function selectDept(oprtrId, oprtrNm, oprtrDeptNm) {

        if (oprtrDeptNm != null && oprtrDeptNm != '') {
            $("#crOprtrDept").val(oprtrDeptNm);
        } else {
            $("#crOprtrDept").val("No affiliation");
        }

        $("#crOprtrNm").val(oprtrNm);
        $("#crOprtrId").val(oprtrId);
        changeDeptListModal('hide');
    }
</script>
