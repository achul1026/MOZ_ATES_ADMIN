<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">

	<div id="container-fluid">

		<!-- Page Heading -->
		<h1 id="content-title" th:text="#{organization.orgnzMngList.title}">전체 연계기관/지역</h1>
		<div id="content-sub-title" th:text="#{organization.orgnzMngList.title.desc}">설명</div>
		
		<div class="btn-wrap-left tab-btn-wrap">
			<button type="button" class="main-btn form-button" id="mapBtn" th:text="#{organization.orgnzMngList.button.map}">지도 확인</button>
			<button type="button" class="sub-btn form-button" id="listBtn" th:text="#{organization.orgnzMngList.button.list}">전체 시설물 현황 관리</button>
		</div>
		
		<div id="ajaxContent"></div>
			
	</div>
	
	
</th:block>

</html>
<script th:inline="javascript">
	const listBtn = $("#listBtn");
	const mapBtn = $("#mapBtn");
	const ajaxContent = $("#ajaxContent");
	
	$(function(){
		let pageType = /*[[${pageType}]]*/;
		if(pageType === "list"){
			ajaxContent.text('');
			mapBtn.removeClass('main-btn');
			mapBtn.addClass('sub-btn');
			listBtn.removeClass('sub-btn');
			listBtn.addClass('main-btn');
			getListAjax();
		}else{
			getMapAjax();
		}
	})
	
	listBtn.click(function() {
		ajaxContent.text('');
		mapBtn.removeClass('main-btn');
		mapBtn.addClass('sub-btn');
		listBtn.removeClass('sub-btn');
		listBtn.addClass('main-btn');
		getListAjax();
	})
	
	mapBtn.click(function() {
		ajaxContent.text('');
		mapBtn.removeClass('sub-btn');
		mapBtn.addClass('main-btn');
		listBtn.removeClass('main-btn');
		listBtn.addClass('sub-btn');
		getMapAjax();
	})
	
	function getMapAjax() {
		$.ajax({
			url: /*[[@{/eqp/orgnz/orgnzMngMapAjax}]]*/ '/eqp/orgnz/orgnzMngMapAjax',
			type: "POST",
			data: $("#frmSearch").serialize(),
			dataType: 'html',
			cache: false,
			success: function (data) {
				ajaxContent.html(data);
			}
		});
	}
	
	function getListAjax() {
		$.ajax({
			url: /*[[@{/eqp/orgnz/orgnzMngListAjax}]]*/ '/eqp/orgnz/orgnzMngListAjax',
			type: "POST",
			data: $("#frmSearch").serialize(),
			dataType: 'html',
			cache: false,
			success: function (data) {
				ajaxContent.html(data);
			}
		});
	}
	
</script>
